name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go build ./...
      # -race is the Tier-1 concurrency gate: the SMTP listener and the nonce
      # replay cache are the live-concurrent paths, and a data race there is a
      # containment bug, not a flake.
      - run: go test -race ./...
      # staticcheck as the Tier-1 static gate. Run via go run with a pinned
      # version so the module stays dependency-free (nothing lands in go.mod).
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  # Tier-1 fuzz gate. Each target runs a short smoke so the
  # committed seed corpus plus a brief exploration catch a regression in a
  # live-reachable parser. The long soak is run out of band, not on every PR.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz runtime-TCB parsers
        run: |
          set -euo pipefail
          targets="
          internal/smtp:FuzzExtractAddr
          internal/smtp:FuzzSplitVerb
          internal/smtp:FuzzReadLine
          internal/smtp:FuzzReadData
          internal/entitlement:FuzzVerify
          internal/store:FuzzParse
          internal/routing:FuzzDecrypt
          internal/webauthn:FuzzVerify
          internal/header:FuzzSplit
          internal/send:FuzzParse
          internal/send:FuzzParseMailbox
          internal/send:FuzzParseSTSPolicy
          internal/config:FuzzSendKeyset
          "
          for spec in $targets; do
            pkg="${spec%%:*}"; name="${spec##*:}"
            echo "::group::$pkg $name"
            go test "./$pkg/" -run='^$' -fuzz="^${name}\$" -fuzztime=20s
            echo "::endgroup::"
          done

  # Reproducibility gate (design §17): build the image on an x86 runner and an
  # Arm runner, which builds amd64 under emulation, and fail if the digests
  # differ. Both use the BuildKit that build-image.sh pins. The release itself is
  # measured by tinfoil-release.yml.
  reproducible-build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: runner.arch == 'ARM64'
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: amd64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Deterministic build
        run: ./scripts/build-image.sh /tmp/edge.oci
      - name: Record image digest
        run: |
          DIGEST=$(cat /tmp/edge.oci/index.json | jq -r '.manifests[0].digest')
          echo "digest=$DIGEST" | tee "digest-${{ matrix.runner }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.runner }}
          path: digest-${{ matrix.runner }}.txt

  compare-digests:
    needs: reproducible-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
      - name: Fail if digests differ
        run: |
          echo "Digests across runners:"
          cat digest-*.txt
          sort -u -t= -k2 digest-*.txt > /tmp/unique || true
          if [ "$(cat digest-*.txt | cut -d= -f2 | sort -u | wc -l)" != "1" ]; then
            echo "::error::Image digests differ across runners — build is not reproducible"
            exit 1
          fi
          echo "Reproducible: all runners produced the same digest."
