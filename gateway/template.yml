AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Fount Fleet mail gateway. Accepts public port 25 and ACME HTTP-01 on port 80,
  and pipes both through an attested Tinfoil tunnel to one pinned edge release.
  It filters connections only (§7). If it runs this template, the gateway can't
  read TLS-protected mail. Senders can't verify that. HAProxy adds the real sender
  IP with a PROXY header. No SSH, no SSM, no connection logs. Deploy TWO of these
  in separate AZs, each with its own MX record, so one VM failing doesn't stop mail.
  With RelayClientPins set, it also runs the edge's outbound relay (§14): mutual
  TLS 1.3 from the pinned edge key, then CONNECT to port 25 on public addresses,
  or 443 on the DoH and mta-sts.* hosts only.

Parameters:
  Ami:
    Type: AWS::EC2::Image::Id
    # al2023-ami-2023.12.20261102.0-kernel-6.18-arm64, us-east-1. AMI IDs are
    # per region; DnfRelease must match the AMI's release.
    Default: ami-0951c836c26e34fc8
  DnfRelease:
    Type: String
    Default: "2023.12.20261102"
  HaproxyPackage:
    Type: String
    Default: haproxy-3.0.30-1.amzn2023.0.1
  Zone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: One AZ per gateway, for example us-east-1a for a and us-east-1b for b.
  EnclaveHost:
    Type: String
    Default: edge.fount.containers.tinfoil.dev # the enclave's own name; mail uses the MX names
  EnclaveRepo:
    Type: String
    Default: fount-labs/fount-mail-edge # targets the enclave by repo, so no admin key on the VM
  EdgeReleaseTag:
    Type: String
    AllowedPattern: "v[0-9]+\\.[0-9]+\\.[0-9]+"
    Description: >
      The only edge release this gateway tunnels to. Changing it replaces the
      instance, so update both stacks right after each edge release.
  ClientCertSecret:
    Type: String
    Description: Secrets Manager name of this gateway's client certificate + key PEM. Its SPKI pin is in the edge's attested GATEWAY_CLIENT_PINS.
  TunnelKeySecret:
    Type: String
    Default: ""
    Description: Secrets Manager name of a tk_ tunnel key, needed once the edge sets shim.authenticated. Empty means no key.
  TinfoilCliVersion:
    Type: String
    Default: "0.19.20"
  TinfoilCliSha256:
    Type: String
    # tinfoil-cli_0.19.20_linux_arm64.tar.gz, matching the release's checksums.txt.
    Default: 22f0595cce22f0e34985e28331bfe9cc360567c7c01f4ecb63380ec5605517ce
  RelayClientPins:
    Type: String
    # The vault's /status send_public.relay_client_pin. Public, so commit it here.
    Default: ""
    AllowedPattern: "([0-9a-f]{64}(,[0-9a-f]{64})*)?"
    Description: >
      Hex SPKI pins of the edge's relay client key. Empty means no outbound relay
      (design §14): nothing is built and the relay port stays closed.
  RelayPort:
    Type: Number
    Default: 443
    Description: The relay's public port. SEND_RELAY_ADDR in the edge's tinfoil-config.yml names it.
  GoVersion:
    Type: String
    # Must satisfy the go line in go.mod at EdgeReleaseTag: the build uses no other toolchain.
    Default: "1.27.3"
  GoSha256:
    Type: String
    # go1.27.3.linux-arm64.tar.gz, from https://go.dev/dl/?mode=json.
    Default: a06e99309dbcbdca1a8ccd2282c3ee146e55930886e26b4f1193269587165f49

Conditions:
  HasTunnelKey: !Not [!Equals [!Ref TunnelKeySecret, ""]]
  HasRelay: !Not [!Equals [!Ref RelayClientPins, ""]]

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      # No managed policies: no SSM, so there's no shell on this VM at all.
      Policies:
        - PolicyName: read-gateway-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ClientCertSecret}-*
                  - !If
                    - HasTunnelKey
                    - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${TunnelKeySecret}-*
                    - !Ref AWS::NoValue
  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]
  Group:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SMTP and ACME HTTP-01 only
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 25, ToPort: 25, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
  # The edge's egress IPs aren't fixed, so the relay is open to all and admits
  # only the pinned client key.
  RelayIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasRelay
    Properties:
      GroupId: !GetAtt Group.GroupId
      IpProtocol: tcp
      FromPort: !Ref RelayPort
      ToPort: !Ref RelayPort
      CidrIp: 0.0.0.0/0
  # User data runs only on first boot, so it lives in a launch template: any
  # change makes a new version, and a new version replaces the instance.
  Launch:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        InstanceType: t4g.micro
        ImageId: !Ref Ami
        IamInstanceProfile: { Arn: !GetAtt Profile.Arn }
        SecurityGroupIds: [!GetAtt Group.GroupId]
        MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub "fount-mail-gateway-${Zone}" }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            # No way in: no SSM agent, no sshd, and no key pair on the instance.
            systemctl disable --now amazon-ssm-agent sshd.service sshd.socket || true
            systemctl mask amazon-ssm-agent sshd.service sshd.socket
            # Journald keeps nothing on disk.
            mkdir -p /etc/systemd/journald.conf.d
            printf '[Journal]\nStorage=volatile\nRuntimeMaxUse=16M\n' > /etc/systemd/journald.conf.d/fount.conf
            systemctl restart systemd-journald
            dnf install -y --releasever=${DnfRelease} ${HaproxyPackage}
            cd /tmp
            V=${TinfoilCliVersion}
            T="tinfoil-cli_${!V}_linux_arm64.tar.gz"
            curl -fsSLO "https://github.com/tinfoilsh/tinfoil-cli/releases/download/v$V/$T"
            echo "${TinfoilCliSha256}  $T" | sha256sum -c
            tar -xzf "$T" tinfoil
            install -m 755 tinfoil /usr/local/bin/tinfoil
            # A missing client certificate stops the boot: without it the edge
            # refuses every tunnelled connection anyway.
            aws secretsmanager get-secret-value --region ${AWS::Region} \
              --secret-id ${ClientCertSecret} --query SecretString --output text \
              > /etc/haproxy/gateway-client.pem
            chown haproxy:haproxy /etc/haproxy/gateway-client.pem
            chmod 600 /etc/haproxy/gateway-client.pem
            install -d -m 700 /etc/fount-tunnel
            : > /etc/fount-tunnel/env
            chmod 600 /etc/fount-tunnel/env
            if [ -n "${TunnelKeySecret}" ]; then
              set +x
              printf 'TINFOIL_TUNNEL_API_KEY=%s\n' "$(aws secretsmanager get-secret-value \
                --region ${AWS::Region} --secret-id ${TunnelKeySecret} \
                --query SecretString --output text)" > /etc/fount-tunnel/env
              set -x
            fi
            cat > /etc/haproxy/haproxy.cfg <<'CFG'
            # No `log` lines anywhere: HAProxy writes nothing about connections.
            # The per-IP table below lives only in memory, for limiting.
            #
            # The 128-tunnel limit is per enclave and shared by both gateways, so
            # each one holds 56 SMTP + 4 ACME and leaves room for health checks.
            global
              maxconn 140
            defaults
              mode tcp
              timeout connect 5s
              timeout client 4m
              timeout server 4m
            # SMTP takes two hops because the PROXY header must travel INSIDE mutual
            # TLS (§7). A single `server ... ssl send-proxy` line writes the header in
            # the clear, ahead of the handshake, so the first hop adds it and the
            # second wraps those bytes as ordinary payload.
            frontend smtp
              bind :25
              maxconn 56
              stick-table type ipv6 size 100k expire 10m store conn_cur,conn_rate(1m)
              tcp-request connection track-sc0 src
              tcp-request connection reject if { sc0_conn_cur gt 4 } || { sc0_conn_rate gt 30 }
              default_backend smtp-framed
            backend smtp-framed
              server wrap 127.0.0.1:2527 send-proxy track edge/tunnel
            frontend smtp-wrap
              bind 127.0.0.1:2527
              maxconn 56
              default_backend edge
            # Open the backend only after the edge's /ready passes twice (design §6:
            # the edge waits 15s so its certificate loads first). /ready is on the
            # shim's port, outside mutual TLS, so its check is plain.
            backend edge
              option httpchk GET /ready
              http-check expect status 200
              server tunnel 127.0.0.1:2526 ssl ssl-min-ver TLSv1.3 crt /etc/haproxy/gateway-client.pem verify none check port 2508 no-check-ssl inter 5s rise 2
            # ACME HTTP-01: plain port 80, then mutual TLS to the challenge responder.
            # This check is the edge's reachable signal: the first request over mutual
            # TLS starts issuance, so outsiders can't start it. `verify none` is safe on
            # both servers because the attested tunnel already proves the enclave.
            frontend acme
              bind :80
              maxconn 4
              default_backend challenge
            backend challenge
              option httpchk GET /
              http-check expect status 200
              server tunnel 127.0.0.1:2580 ssl ssl-min-ver TLSv1.3 crt /etc/haproxy/gateway-client.pem verify none check inter 30s
            CFG
            # tinfoil forward re-verifies the enclave by itself, and only accepts the
            # release at ${EnclaveRepo}@${EdgeReleaseTag}. -L maps:
            #   2526 -> edge :2525  (SMTP)        2580 -> edge :8088 (ACME HTTP-01)
            #   2508 -> edge :8080  (shim /ready health check)
            cat > /usr/local/bin/fount-tunnel <<'SH'
            #!/bin/sh
            exec /usr/local/bin/tinfoil forward ${EnclaveHost} --repo ${EnclaveRepo}@${EdgeReleaseTag} \
              -L 127.0.0.1:2526:2525 \
              -L 127.0.0.1:2580:8088 \
              -L 127.0.0.1:2508:8080
            SH
            chmod 755 /usr/local/bin/fount-tunnel
            cat > /etc/systemd/system/fount-tunnel.service <<'UNIT'
            [Unit]
            After=network-online.target
            Wants=network-online.target
            StartLimitIntervalSec=0
            [Service]
            ExecStart=/usr/local/bin/fount-tunnel
            EnvironmentFile=/etc/fount-tunnel/env
            Restart=always
            RestartSec=5
            DynamicUser=yes
            StateDirectory=fount-tunnel
            Environment=HOME=/var/lib/fount-tunnel
            StandardOutput=null
            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            # Start the enclave FIRST (design §7: a gateway that looks up the host
            # early can cache "no such host" for up to 30 minutes).
            systemctl enable --now fount-tunnel haproxy
            # Outbound relay (design §14), last so a failure here leaves inbound
            # mail running. gateway/relay is built from the same edge tag the
            # tunnel pins, with a pinned Go that is deleted afterwards. A tag
            # without gateway/relay (or the parked v0.0.0) fails here, so set
            # RelayClientPins only with a tag that has it.
            if [ -n "${RelayClientPins}" ]; then
              cat > /tmp/fount-relay-build <<'RELAYBUILD'
            #!/bin/bash
            # fount-relay-build SRC: builds SRC/gateway/relay into /usr/local/bin/fount-relay.
            set -euo pipefail
            src=$1
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            cd "$work"
            curl -fsSLO "https://go.dev/dl/go${GoVersion}.linux-arm64.tar.gz"
            echo "${GoSha256}  go${GoVersion}.linux-arm64.tar.gz" | sha256sum -c
            tar -xzf "go${GoVersion}.linux-arm64.tar.gz"
            cd "$src"
            env -i PATH=/usr/bin:/bin HOME="$work" GOCACHE="$work/cache" GOPATH="$work/gopath" \
              GOTOOLCHAIN=local GOFLAGS=-mod=vendor CGO_ENABLED=0 \
              "$work/go/bin/go" build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o /usr/local/bin/fount-relay ./gateway/relay
            RELAYBUILD
              mkdir /tmp/relay-src
              curl -fsSL "https://github.com/${EnclaveRepo}/archive/refs/tags/${EdgeReleaseTag}.tar.gz" \
                | tar -xz -C /tmp/relay-src --strip-components=1
              bash /tmp/fount-relay-build /tmp/relay-src
              rm -rf /tmp/relay-src /tmp/fount-relay-build
              # The server key is the gateway's client key, whose pin the edge
              # already has (GATEWAY_CLIENT_PINS), so SEND_RELAY_PINS is the same list.
              cat > /etc/systemd/system/fount-relay.service <<'UNIT'
            [Unit]
            After=network-online.target
            Wants=network-online.target
            StartLimitIntervalSec=0
            [Service]
            ExecStart=/usr/local/bin/fount-relay -listen :${RelayPort} -client-pins ${RelayClientPins}
            LoadCredential=server.pem:/etc/haproxy/gateway-client.pem
            Restart=always
            RestartSec=5
            DynamicUser=yes
            AmbientCapabilities=CAP_NET_BIND_SERVICE
            CapabilityBoundingSet=CAP_NET_BIND_SERVICE
            NoNewPrivileges=yes
            ProtectSystem=strict
            ProtectHome=yes
            PrivateTmp=yes
            PrivateDevices=yes
            ProtectKernelTunables=yes
            ProtectKernelModules=yes
            ProtectControlGroups=yes
            RestrictNamespaces=yes
            RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
            LockPersonality=yes
            MemoryDenyWriteExecute=yes
            SystemCallArchitectures=native
            # The relay already refuses these; this is a second wall around the
            # instance metadata service.
            IPAddressDeny=169.254.169.254 fd00:ec2::254
            LimitNOFILE=4096
            StandardOutput=null
            [Install]
            WantedBy=multi-user.target
            UNIT
              systemctl daemon-reload
              systemctl enable --now fount-relay
            fi
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !Ref Zone
      LaunchTemplate:
        LaunchTemplateId: !Ref Launch
        Version: !GetAtt Launch.LatestVersionNumber
  Ip:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref Instance

Outputs:
  PublicIp:
    Value: !Ref Ip
  InstanceId:
    Value: !Ref Instance
