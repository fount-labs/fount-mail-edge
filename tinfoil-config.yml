# PROPOSED split layout (docs/CONTAINER-SPLIT.md, stages 1 and 2). Tinfoil reads only
# tinfoil-config.yml, so this file changes nothing live. At the release that
# turns the split on, it replaces tinfoil-config.yml, with the release's digest
# and commitments. cmd/edge's split tests keep it in line with that file.
#
# Fount Fleet mail edge — Tinfoil enclave config (measured as part of attestation).
#
# Approving a release pins everything in this file: the image digest, the
# attested keys, the vaults, the keyset commitment, and the egress allowlist.
#
# This repo is PUBLIC by design (reproducible builds need a public source). No
# secret value lives here. After boot the edge pulls its keys from a Fount Mail
# vault, which verifies this release first, and accepts only the keyset that
# KEYSET_COMMITMENT names (see fount-mail-vault).

cvm-version: 0.14.17 # https://github.com/tinfoilsh/cvmimage/releases/latest, no `v`
cpus: 2
memory: 8192

# Per-boot keys generated inside the enclave; their public halves are in the
# attestation, so no one outside ever holds them (design §5 "Edge keys").
attested-keys:
  - id: mail-tls   # ecdsa-p256: STARTTLS (ACME cert) + Device API TLS leaf; mail-front only
    key: ecdsa-p256
  - id: mail-sign  # ed25519: signs each stored message (design §9)
    key: ed25519
  - id: transfer   # x25519: the vault seals the keyset to this
    key: x25519
  - id: send-transfer # x25519: the vault seals the send keyset alone to this, and leaves it out of transfer's box; mail-send only
    key: x25519

networks:
  edge:
    # Tinfoil has no wildcards; list every host by exact name. It resolves each one
    # when it builds the firewall, so the edge can't deploy while either vault is gone.
    egress: allowlist
    allow:
      - vault-a.fount.containers.tinfoil.dev
      - vault-b.fount.containers.tinfoil.dev
      - acme-v02.api.letsencrypt.org
  internal: {} # closed: mail-core reaches the forwarder here and nothing else
  frontlink: {} # closed: mail-front reaches mail-core here, and has no other network
  sendnet: {} # closed: mail-core reaches mail-send here
  # mail-send's way out: the vaults it pulls the send keyset from, and the relay
  # host (SEND_RELAY_ADDR's). All send traffic (DoH, MTA-STS, port 25) goes through
  # the relay. Tinfoil resolves every name here at deploy, so a new relay IP needs
  # a redeploy.
  sendout:
    egress: allowlist
    allow:
      - vault-a.fount.containers.tinfoil.dev
      - vault-b.fount.containers.tinfoil.dev
      - out.fountbox.com
  # The forwarder only. S3 doesn't work through an allowlist (design §6).
  storage:
    egress: open

containers:
  # Holds the keyset, S3 credentials, mail-sign and transfer: routing, sealing,
  # storage, ACME, the Device API and /operator, and the send checks that need
  # routing data. No TLS key, no send key, no tunnelled port but 8080, which the
  # shim and the gateway's /ready check reach.
  - name: mail-core
    image: "ghcr.io/fount-labs/fount-mail-edge@sha256:4c2061f1c0d6153b9b23a6cf3176d6de9a4fb37e6d222f13798c51cf97bfa708" # set by release
    command: ["core"]
    networks: [edge, internal, frontlink, sendnet]
    keys: [mail-sign, transfer]
    attestation: true # the socket the edge attests to the vault through
    restart: always
    healthcheck:
      test: ["CMD", "/edge", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
    ports: ["8080:8080"] # /ready, which the gateway checks over the tunnel
    tmpfs:
      /tmp: "size=64m"
    env:
      - MAIL_HOSTNAMES: "mx1.fountbox.com,mx2.fountbox.com"
      - MAIL_DOMAIN: "@fountbox.com"
      - ACME_DIRECTORY: "https://acme-v02.api.letsencrypt.org/directory"
      - S3_BUCKET: "fount-mail-063207099341"
      - S3_BOOT_LOG_BUCKET: "fount-mail-bootlog-063207099341"
      - S3_BACKUP_BUCKET: "fount-mail-routing-backup-063207099341"
      - S3_REGION: "us-east-1"
      - EGRESS_FORWARDER: "forwarder"
      - EGRESS_ROUTES: "9001=fount-mail-063207099341.s3.us-east-1.amazonaws.com,9002=fount-mail-bootlog-063207099341.s3.us-east-1.amazonaws.com,9003=fount-mail-routing-backup-063207099341.s3.us-east-1.amazonaws.com" # same value on the forwarder
      - VAULT_HOSTS: "vault-a.fount.containers.tinfoil.dev,vault-b.fount.containers.tinfoil.dev"
      - KEYSET_COMMITMENT: "db2d1d4e7a8e474c78d48b89e93ccac6d9810776cda72ca8955000f9987dcb95" # from the vault's /status after it generates
      - ENTITLEMENT_VERIFY_KEY: "SFGtxHgwCfhpp7R03IDEcJy2RuX0a/KH9oGTDOXy6/4=" # public, base64 raw Ed25519; PROD key (alias/fount-mail-entitlement-signing-prod)
      - RECOVERY_RP_ID: "fount.sh" # WebAuthn RP id for /recover and /pause; fount.sh serves the passkey AASA. RECOVERY_ORIGIN stays unset until a signed build shows the origin
      - OPERATOR_KEY: "6b8cebf9ea0a064955b8673b49d715d70be2265b89c025b483a8e8ceec4ae986" # public, hex Ed25519; signs edgectl requests, same as the vault's
      - SEND_LINK: "mail-send:7026"

  # Holds mail-tls and nothing from the vault: gateway mutual TLS, SMTP with
  # STARTTLS, the CSR, and the tunnelled ports. Its one network is closed and
  # reaches only mail-core.
  - name: mail-front
    image: "ghcr.io/fount-labs/fount-mail-edge@sha256:4c2061f1c0d6153b9b23a6cf3176d6de9a4fb37e6d222f13798c51cf97bfa708" # set by release
    command: ["front"]
    networks: [frontlink]
    keys: [mail-tls]
    ipc: none
    restart: always
    healthcheck:
      test: ["CMD", "/edge", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
    ports: ["2525:2525", "8443:8443", "8088:8088"]
    env:
      - MAIL_HOSTNAMES: "mx1.fountbox.com,mx2.fountbox.com"
      - MAIL_DOMAIN: "@fountbox.com"
      - GATEWAY_CLIENT_PINS: "b19b9c3464bb8bf70a5b15ff7085d13c65217dadf4080a3132cf8a0559f86802,66d483720439bcf18d5515135f5e9405c465c66409596b4d5c0878648150c50d" # gateways a and b; a new gateway key needs a new release
      - CORE_LINK: "mail-core:7025"
      - CORE_API: "mail-core:8080"

  # Holds send-transfer and, once a vault hands it over, the send keyset (DKIM
  # and the relay client key): signs and delivers what mail-core hands it. Every
  # send setting lives here and nowhere else; the release sets none, so sending
  # stays off. Turning it on is a release that sets the commitment (the vaults'
  # 98fcffaa…3480), the relay address and pins, the DKIM selector and the
  # enable flag here, and adds the relay host to sendout.
  - name: mail-send
    image: "ghcr.io/fount-labs/fount-mail-edge@sha256:4c2061f1c0d6153b9b23a6cf3176d6de9a4fb37e6d222f13798c51cf97bfa708" # set by release
    command: ["send"]
    networks: [sendnet, sendout]
    keys: [send-transfer]
    attestation: true # it pulls the send keyset through this
    ipc: none
    restart: always
    healthcheck:
      test: ["CMD", "/edge", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
    env:
      - MAIL_HOSTNAMES: "mx1.fountbox.com,mx2.fountbox.com"
      - MAIL_DOMAIN: "@fountbox.com"
      - VAULT_HOSTS: "vault-a.fount.containers.tinfoil.dev,vault-b.fount.containers.tinfoil.dev"
      - SEND_KEYSET_COMMITMENT: "98fcffaa60cd775f58d4fa99cc7977bb467be49c37a6f5873c0f36286cd33480" # the vaults' send keyset (v0.2.1)
      - SEND_RELAY_ADDR: "out.fountbox.com:443" # the relay host, EC2 in the older Fount account
      - SEND_RELAY_PINS: "6325543a9b159e5315c48de774df42632f58911ce48d9c224699751d7358e95e" # its server key, from check-pin.sh
      - DKIM_SELECTOR: "f1" # f1/f1e._domainkey.fountbox.com hold the send keyset's public halves
      - SEND_EHLO_NAME: "out.fountbox.com" # the relay's PTR
      - SEND_ENABLED: "1"

  - name: forwarder
    image: "ghcr.io/fount-labs/fount-mail-edge@sha256:4c2061f1c0d6153b9b23a6cf3176d6de9a4fb37e6d222f13798c51cf97bfa708" # set by release, same digest as mail-edge
    networks: [internal, storage]
    command: ["egress-forward"]
    restart: always
    healthcheck:
      test: ["CMD", "/edge", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
    env:
      - EGRESS_ROUTES: "9001=fount-mail-063207099341.s3.us-east-1.amazonaws.com,9002=fount-mail-bootlog-063207099341.s3.us-east-1.amazonaws.com,9003=fount-mail-routing-backup-063207099341.s3.us-east-1.amazonaws.com"

shim:
  upstream-container: mail-core
  upstream-port: 8080
  paths:
    - /health
    - /ready
    # edgectl: signed routing init, role mailboxes, and restores
    - /operator/status
    - /operator/begin
    - /operator/init
    - /operator/provision
    - /operator/restore
    # Device API (design §8), built routes only. Each is signed per its row in
    # internal/deviceapi; cmd/edge's TestShimPathsMatchDeviceAPI keeps this in sync.
    # The shim matches exactly, or by segment prefix where a path ends in /*.
    - /mailbox
    - /handle/*
    - /address
    - /routing
    - /entitlement
    - /mail
    - /mail/*
    - /gaps
    - /boots/*
    - /recover
    - /recover/*
    - /pause
    - /pause/*
    - /send
    - /connect
